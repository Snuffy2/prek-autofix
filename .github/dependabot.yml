version: 2
updates:
  - package-ecosystem: "npm"
    commit-message:
      prefix: "deps"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # typescript-eslint 8 currently declares support through TypeScript 6.
      - dependency-name: "typescript"
        versions:
          - ">=7.0.0"
    cooldown:
      default-days: 7
  - package-ecosystem: "github-actions"
    commit-message:
      prefix: "deps"
    directories:
      - "/"
      - "/review"
      - "/fix"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      major-actions-by-dependency:
        group-by: "dependency-name"
        update-types:
          - "major"
    cooldown:
      default-days: 7
