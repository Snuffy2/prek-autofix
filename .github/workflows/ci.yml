name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      # The separate prek workflow commits bundle updates for Dependabot.
      # Identify the PR author so maintainer updates use the same build path.
      - name: Build bundled actions for Dependabot
        if:
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login == 'dependabot[bot]'
        run: npm run build

      - name: Verify bundled actions
        if:
          github.event_name != 'pull_request' ||
          github.event.pull_request.user.login != 'dependabot[bot]'
        run: npm run check:dist
