name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description:
          Existing release tag whose moving major tag should be updated
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event.repository.fork == false && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create or update the release pull request
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  update-major-tag:
    needs: release-please
    if: >-
      always() && !cancelled() && github.event.repository.fork == false &&
      (github.event_name == 'workflow_dispatch' || (needs.release-please.result
      == 'success' && needs.release-please.outputs.release_created == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout trusted release helpers
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Update stable moving major tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG:
            ${{ needs.release-please.outputs.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must use the vMAJOR.MINOR.PATCH format." >&2
            exit 1
          fi
          gh auth setup-git --hostname github.com
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
          TARGET_SHA="$(git rev-parse 'FETCH_HEAD^{commit}')"
          export TARGET_SHA
          bash .github/scripts/update-major-tag.sh
