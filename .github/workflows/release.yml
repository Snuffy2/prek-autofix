name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  verify:
    if: github.event.release.prerelease == false
    outputs:
      major-tag: ${{ steps.release.outputs.major-tag }}
      release-sha: ${{ steps.release.outputs.sha }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out immutable release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:dist

      - name: Validate semantic release tag
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must have vMAJOR.MINOR.PATCH form" >&2
            exit 1
          fi
          echo "major-tag=v${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  update-major:
    needs: verify
    permissions:
      contents: write
    concurrency:
      group: release-major-${{ github.repository }}-${{ needs.verify.outputs.major-tag }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Update moving major tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          TARGET_SHA: ${{ needs.verify.outputs.release-sha }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must have vMAJOR.MINOR.PATCH form" >&2
            exit 1
          fi
          major_tag="v${BASH_REMATCH[1]}"
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Verified release SHA is invalid" >&2
            exit 1
          fi

          tags_file="$(mktemp)"
          releases_file="$(mktemp)"
          trap 'rm -f "$tags_file" "$releases_file"' EXIT
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/tags?per_page=100" > "$tags_file"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$releases_file"

          decision="$(
            TAGS_FILE="$tags_file" RELEASES_FILE="$releases_file" node <<'NODE'
          const fs = require("node:fs");

          function decide() {
          const releaseTag = process.env.RELEASE_TAG;
          const targetSha = process.env.TARGET_SHA;
          const tagPages = JSON.parse(fs.readFileSync(process.env.TAGS_FILE, "utf8"));
          const releasePages = JSON.parse(
            fs.readFileSync(process.env.RELEASES_FILE, "utf8"),
          );
          const tags = tagPages.flat();
          const releases = releasePages.flat();
          const semverPattern = /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/;
          const releaseMatch = semverPattern.exec(releaseTag);
          if (!releaseMatch) {
            throw new Error("Release tag must have vMAJOR.MINOR.PATCH form");
          }

          const releaseVersion = releaseMatch.slice(1).map(BigInt);
          const majorTag = `v${releaseMatch[1]}`;
          const compare = (left, right) => {
            for (let index = 0; index < 3; index += 1) {
              if (left[index] < right[index]) return -1;
              if (left[index] > right[index]) return 1;
            }
            return 0;
          };
          const eligibleReleases = releases.filter(
            (release) =>
              release.draft === false &&
              release.prerelease === false &&
              release.published_at &&
              semverPattern.test(release.tag_name),
          );
          const triggeringRelease = eligibleReleases.find(
            (release) => release.tag_name === releaseTag,
          );
          if (!triggeringRelease) {
            throw new Error("Triggering release is not a published stable release");
          }
          const stableTags = eligibleReleases.flatMap((release) => {
            const match = semverPattern.exec(release.tag_name);
            if (BigInt(match[1]) !== releaseVersion[0]) return [];
            const tag = tags.find((candidate) => candidate.name === release.tag_name);
            if (!tag) {
              throw new Error(
                `Published stable release ${release.tag_name} has no matching tag`,
              );
            }
            return [{
              name: tag.name,
              sha: tag.commit.sha,
              version: match.slice(1).map(BigInt),
            }];
          });
          const releaseRef = stableTags.find((tag) => tag.name === releaseTag);
          if (!releaseRef || releaseRef.sha !== targetSha) {
            throw new Error("Verified release SHA does not match its immutable tag");
          }
          if (stableTags.length === 0) {
            throw new Error("No immutable stable tags were returned by GitHub");
          }

          const highest = stableTags.reduce((left, right) =>
            compare(left.version, right.version) >= 0 ? left : right,
          );
          if (compare(releaseVersion, highest.version) < 0) {
            return "skip\t";
          }

          const current = tags.find((tag) => tag.name === majorTag);
          if (!current) {
            return `create\t${targetSha}`;
          }
          if (current.commit.sha === targetSha) {
            return "noop\t";
          }

          const currentVersions = stableTags.filter(
            (tag) => tag.sha === current.commit.sha,
          );
          if (currentVersions.length === 0) {
            throw new Error(
              `${majorTag} does not point to a known immutable stable release`,
            );
          }
          const currentVersion = currentVersions.reduce((left, right) =>
            compare(left.version, right.version) >= 0 ? left : right,
          );
          if (compare(releaseVersion, currentVersion.version) < 0) {
            return "skip\t";
          }
          return `update\t${targetSha}`;
          }

          process.stdout.write(decide());
          NODE
          )"

          IFS=$'\t' read -r action update_sha <<< "$decision"
          case "$action" in
          skip)
            echo "$RELEASE_TAG is not the newest stable $major_tag release; leaving $major_tag unchanged"
            ;;
          noop)
            echo "$major_tag already points to $RELEASE_TAG"
            ;;
          update)
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/git/refs/tags/$major_tag" \
              -f sha="$update_sha" -F force=true
            ;;
          create)
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$major_tag" -f sha="$update_sha"
            ;;
          *)
            echo "Unable to determine a safe moving-tag update" >&2
            exit 1
            ;;
          esac
