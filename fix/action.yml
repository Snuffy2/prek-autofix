name: prek Autofix Fix
description:
  Safely apply a collected prek-autofix artifact to a pull request branch
author: Snuffy2
inputs:
  github-token:
    description:
      Workflow token used to validate the source run, download the artifact, and
      manage recovery comments; also used for statuses when autofix-token is
      empty
    required: false
    default: ${{ github.token }}
  autofix-token:
    description:
      Required token input for commit statuses and validated branch updates; an
      empty value uses github-token for statuses and same-repository updates
    required: true
  commit-message:
    description: Commit message for the generated fix commit
    required: false
    default: "[prek-autofix] apply automatic fixes"
  source-workflow:
    description: Expected collection workflow name
    required: false
    default: prek-autofix
  max-files:
    description: Maximum number of file operations
    required: false
    default: "100"
  max-bytes:
    description: Maximum decoded artifact content size
    required: false
    default: "10485760"
runs:
  using: node24
  main: ../dist/apply/index.js

branding:
  icon: edit-3
  color: blue
